<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="full-v30-index-title full-v30-index-desc"><title id="full-v30-index-title">用地点时刻键填表，不能直接reshape</title><desc id="full-v30-index-desc">三条乱序长记录，两个时刻两个地点；缺失B在t1的值保留缺测，同一个键不可重复填入而不处理。</desc><text x="180" y="25" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">乱序长表 → 按键填入矩阵</text><text x="20" y="64" text-anchor="start" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">(B,t₂,4)</text><text x="20" y="99" text-anchor="start" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">(A,t₁,1)</text><text x="20" y="134" text-anchor="start" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">(A,t₂,3)</text><line x1="125" y1="103" x2="185" y2="103" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M178,106 L185,103 L178,100" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><rect x="205" y="65" width="45" height="45" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1"/><text x="227.5" y="93.5" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">1</text><rect x="250" y="65" width="45" height="45" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1"/><text x="272.5" y="93.5" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">缺测</text><rect x="205" y="110" width="45" height="45" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1"/><text x="227.5" y="138.5" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">3</text><rect x="250" y="110" width="45" height="45" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1"/><text x="272.5" y="138.5" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">4</text><text x="226" y="53" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">A</text><text x="271" y="53" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">B</text><text x="190" y="94" text-anchor="end" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">t₁</text><text x="190" y="137" text-anchor="end" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">t₂</text><text x="180" y="213" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">地点顺序固定 A,B；时刻顺序 t₁,t₂</text><text x="180" y="253" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-basis,#855224)">缺少(B,t₁) ≠ 观测值0</text></svg>
