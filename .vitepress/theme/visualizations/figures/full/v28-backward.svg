<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="full-v28-backward-title full-v28-backward-desc"><title id="full-v28-backward-title">分支梯度必须相加</title><desc id="full-v28-backward-desc">一支贡献−2乘0.5=−1，另一支2乘1=2；h总梯度1，不是任一分支梯度。</desc><line x1="285" y1="140" x2="228" y2="78" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M234.946,81.123 L228,78 L230.529,85.184" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><line x1="285" y1="140" x2="228" y2="202" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M230.529,194.816 L228,202 L234.946,198.877" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><line x1="143" y1="78" x2="88" y2="140" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M90.401,132.773 L88,140 L94.89,136.754" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><line x1="143" y1="202" x2="88" y2="140" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M94.89,143.246 L88,140 L90.401,147.227" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><rect x="4" y="111" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="46" y="136" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">∂L/∂h</text><text x="46" y="159" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">1</text><rect x="143" y="49" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="185" y="74" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">∂L/∂a₁</text><text x="185" y="97" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">−2</text><rect x="143" y="173" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="185" y="198" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">∂L/∂a₂</text><text x="185" y="221" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">2</text><rect x="272" y="111" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="314" y="136" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">损失 L</text><text x="314" y="159" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">上游1</text><text x="93" y="82" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-part,#3b65a0)">×0.5</text><text x="95" y="213" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-part,#3b65a0)">×1</text><text x="175" y="25" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">回到共享节点：−1 + 2 = 1</text><text x="180" y="268" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">各路径先乘，再在共享输入处求和</text></svg>
