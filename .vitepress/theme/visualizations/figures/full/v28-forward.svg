<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="full-v28-forward-title full-v28-forward-desc"><title id="full-v28-forward-title">共享输入的前向计算</title><desc id="full-v28-forward-desc">h=2分成两支，a1=1,a2=2，损失2+2=4；此时尚未改变参数。</desc><line x1="82" y1="140" x2="143" y2="78" style="stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><path d="M140.229,85.094 L143,78 L135.952,80.886" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><line x1="82" y1="140" x2="143" y2="202" style="stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><path d="M135.952,199.114 L143,202 L140.229,194.906" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><line x1="227" y1="78" x2="272" y2="140" style="stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><path d="M265.46,136.097 L272,140 L270.316,132.573" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><line x1="227" y1="202" x2="272" y2="140" style="stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><path d="M270.316,147.427 L272,140 L265.46,143.903" style="fill:none;stroke:var(--edu-axis,#707a81);stroke-width:1.8;"/><rect x="4" y="111" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="46" y="136" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">输入 h</text><text x="46" y="159" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">2</text><rect x="143" y="49" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="185" y="74" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">a₁=.5h</text><text x="185" y="97" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">1</text><rect x="143" y="173" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="185" y="198" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">a₂=h</text><text x="185" y="221" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">2</text><rect x="272" y="111" width="84" height="58" rx="3" style="fill:var(--vp-c-bg,#fff);stroke:var(--edu-axis,#707a81)"/><text x="314" y="136" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">总损失 L</text><text x="314" y="159" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">4</text><text x="180" y="25" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">L = ½(a₁−3)² + ½a₂²</text><text x="180" y="268" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">前向值保存后，再开始求导</text></svg>
