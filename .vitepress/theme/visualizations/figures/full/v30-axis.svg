iddle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">A</text><text x="175" y="53" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">B</text><text x="215" y="53" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-ink,#333)">C</text><line x1="175" y1="148" x2="175" y2="181" style="stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><path d="M172,174 L175,181 L178,174" style="fill:none;stroke:var(--edu-part,#3b65a0);stroke-width:1.8;"/><text x="180" y="210" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-part,#3b65a0)">axis=0均值：(2.5,3.5,4.5)</text><text x="180" y="253" text-anchor="middle" style="font:16px system-ui,sans-serif;fill:var(--edu-object,#226451)">axis=1均值：(2,5)</text></svg>
