<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" role="img" aria-labelledby="basis-oblique-title basis-oblique-desc">
<title id="basis-oblique-title">斜基：坐标 (2, 1)</title><desc id="basis-oblique-desc">b1=(1,0)、b2=(1,1)。棕箭头各是一份基向量；蓝虚线先走2b1再走b2，物理终点仍为(3,1)。b2不要求单位长度。</desc>
