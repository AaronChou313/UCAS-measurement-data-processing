<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="basis-oblique-title basis-oblique-desc">
<title id="basis-oblique-title">斜基：坐标 (2, 1)</title><desc id="basis-oblique-desc">物理向量仍指向(3,1)，新基b1=(1,0)、b2=(1,1)。先走2b1，再走b2，得到同一向量。</desc>
<defs><marker id="basis-oblique-object" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-object"/></marker><marker id="basis-oblique-basis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-basis"/></marker><marker id="basis-oblique-part" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-part"/></marker><marker id="basis-oblique-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-axis"/></marker></defs>
<rect x="0" y="0" width="360" height="330" class="plot-bg" rx="4"/>
<text x="18" y="28" class="plot-heading">斜基：坐标 (2, 1)</text>
<line x1="28.049999999999997" y1="203" x2="331.20000000000005" y2="203" class="axis" marker-end="url(#basis-oblique-axis)"/><line x1="142" y1="280.4" x2="142" y2="46.05000000000001" class="axis" marker-end="url(#basis-oblique-axis)"/>
<line x1="56" y1="205.58" x2="56" y2="200.42" class="tick" /><text x="56" y="221" text-anchor="middle" class="tick-text">-2</text><line x1="99" y1="205.58" x2="99" y2="200.42" class="tick" /><text x="99" y="221" text-anchor="middle" class="tick-text">-1</text><line x1="185" y1="205.58" x2="185" y2="200.42" class="tick" /><text x="185" y="221" text-anchor="middle" class="tick-text">1</text><line x1="228" y1="205.58" x2="228" y2="200.42" class="tick" /><text x="228" y="221" text-anchor="middle" class="tick-text">2</text><line x1="271" y1="205.58" x2="271" y2="200.42" class="tick" /><text x="271" y="221" text-anchor="middle" class="tick-text">3</text><line x1="314" y1="205.58" x2="314" y2="200.42" class="tick" /><text x="314" y="221" text-anchor="middle" class="tick-text">4</text>
<line x1="139.42" y1="246" x2="144.58" y2="246" class="tick" /><text x="130" y="250" text-anchor="end" class="tick-text">-1</text><line x1="139.42" y1="160" x2="144.58" y2="160" class="tick" /><text x="130" y="164" text-anchor="end" class="tick-text">1</text><line x1="139.42" y1="117" x2="144.58" y2="117" class="tick" /><text x="130" y="121" text-anchor="end" class="tick-text">2</text><line x1="139.42" y1="74" x2="144.58" y2="74" class="tick" /><text x="130" y="78" text-anchor="end" class="tick-text">3</text>
<text x="328.20000000000005" y="193" class="axis-label">x</text><text x="152" y="50.05000000000001" class="axis-label">y</text>
<text x="128" y="221" class="tick-text">O</text>
<line x1="142" y1="203" x2="185" y2="203" class="basis" marker-end="url(#basis-oblique-basis)"/><line x1="142" y1="203" x2="185" y2="160" class="basis" marker-end="url(#basis-oblique-basis)"/><line x1="142" y1="203" x2="228" y2="203" class="part" marker-end="url(#basis-oblique-part)"/><line x1="228" y1="203" x2="271" y2="160" class="part" marker-end="url(#basis-oblique-part)"/><line x1="142" y1="203" x2="271" y2="160" class="object" marker-end="url(#basis-oblique-object)"/><circle cx="271" cy="160" r="3" class="fill-object"/><text x="173" y="251" class="part-label">2b₁</text><text x="251" y="195" class="part-label">b₂</text><text x="170" y="147" class="basis-label">b₂ = (1, 1)</text><text x="282" y="162" class="object-label">v</text><text x="18" y="292" >v = 2b₁ + b₂，物理箭头没有动。</text><text x="18" y="314" >B 改变了，坐标随之改为 (2, 1)。</text>
</svg>
