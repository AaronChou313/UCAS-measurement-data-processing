<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="basis-standard-title basis-standard-desc">
<title id="basis-standard-title">标准基：坐标 (3, 1)</title><desc id="basis-standard-desc">固定向量从原点指向(3,1)，先走3个横向标准基，再走1个纵向标准基。</desc>
<defs><marker id="basis-standard-object" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-object"/></marker><marker id="basis-standard-basis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-basis"/></marker><marker id="basis-standard-part" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-part"/></marker><marker id="basis-standard-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="fill-axis"/></marker></defs>
<rect x="0" y="0" width="360" height="330" class="plot-bg" rx="4"/>
<text x="18" y="28" class="plot-heading">标准基：坐标 (3, 1)</text>
