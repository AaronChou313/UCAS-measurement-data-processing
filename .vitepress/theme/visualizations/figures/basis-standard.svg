<line x1="56" y1="205.58" x2="56" y2="200.42" class="tick" /><text x="56" y="221" text-anchor="middle" class="tick-text">-2</text><line x1="99" y1="205.58" x2="99" y2="200.42" class="tick" /><text x="99" y="221" text-anchor="middle" class="tick-text">-1</text><line x1="185" y1="205.58" x2="185" y2="200.42" class="tick" /><text x="185" y="221" text-anchor="middle" class="tick-text">1</text><line x1="228" y1="205.58" x2="228" y2="200.42" class="tick" /><text x="228" y="221" text-anchor="middle" class="tick-text">2</text><line x1="271" y1="205.58" x2="271" y2="200.42" class="tick" /><text x="271" y="221" text-anchor="middle" class="tick-text">3</text><line x1="314" y1="205.58" x2="314" y2="200.42" class="tick" /><text x="314" y="221" text-anchor="middle" class="tick-text">4</text>
<line x1="139.42" y1="246" x2="144.58" y2="246" class="tick" /><text x="130" y="250" text-anchor="end" class="tick-text">-1</text><line x1="139.42" y1="160" x2="144.58" y2="160" class="tick" /><text x="130" y="164" text-anchor="end" class="tick-text">1</text><line x1="139.42" y1="117" x2="144.58" y2="117" class="tick" /><text x="130" y="121" text-anchor="end" class="tick-text">2</text><line x1="139.42" y1="74" x2="144.58" y2="74" class="tick" /><text x="130" y="78" text-anchor="end" class="tick-text">3</text>
